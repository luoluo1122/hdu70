<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>芯火七十年 · I Wanna 校史闯关</title>
<style>
  :root{
    --bg:#06080e; --panel:rgba(9,14,26,.92); --line:rgba(120,180,255,.18);
    --ink:#e8f1ff; --dim:#8496b3; --accent:#4fd1ff; --gold:#ffd166; --red:#ff4d6d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:
      radial-gradient(1100px 700px at 50% -10%, #101d33 0%, transparent 62%),
      radial-gradient(900px 600px at 90% 110%, #170f28 0%, transparent 58%),
      var(--bg);
    color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100%;padding:16px;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;
    background-image:linear-gradient(rgba(90,150,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(90,150,230,.06) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 78%);
  }
  #stage{position:relative;width:min(1280px,100%);aspect-ratio:16/10;border-radius:16px;overflow:hidden;
    box-shadow:0 26px 70px rgba(0,0,0,.7),0 0 0 1px var(--line);background:#04070d;isolation:isolate}
  #stage>canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

  /* HUD */
  #hud{position:absolute;inset:0;pointer-events:none;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(5,10,20,.66);
    border:1px solid var(--line);font-size:13px;letter-spacing:.6px;backdrop-filter:blur(6px)}
  .pill b{font-size:15px;font-variant-numeric:tabular-nums}
  #eraTag{color:var(--gold);font-weight:700;letter-spacing:1px}
  #dots{display:flex;gap:6px;align-items:center}
  #dots i{width:18px;height:6px;border-radius:99px;background:rgba(255,255,255,.14);display:block}
  #dots i.on{background:linear-gradient(90deg,var(--accent),var(--gold))}
  #dots i.cur{box-shadow:0 0 10px var(--accent)}

  /* 题目条 */
  #qbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(820px,86%);
    background:rgba(6,11,21,.92);border:1px solid rgba(255,209,102,.35);border-radius:14px;
    padding:9px 16px;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;backdrop-filter:blur(8px)}
  #qbar.show{opacity:1;transform:translateX(-50%) translateY(-2px)}
  #qbar .q{font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;text-align:center}
  #qbar .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#b9cae2}
  #qbar .opts span{background:rgba(255,255,255,.05);border:1px solid rgba(120,180,255,.14);padding:3px 8px;border-radius:7px}
  #qbar .opts b{color:var(--gold);margin-right:4px}

  /* 提示 */
  #toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
    opacity:0;transition:opacity .25s;z-index:4}
  #toast.show{opacity:1}
  #toast .t1{font-size:26px;font-weight:800;letter-spacing:3px;text-shadow:0 4px 24px rgba(0,0,0,.8)}
  #toast .t2{margin-top:8px;font-size:14px;color:#c8d8ee;letter-spacing:1px}

  /* 史料字幕 */  #sub{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:min(860px,90%);
    padding:8px 18px;border-radius:999px;background:rgba(6,11,21,.86);border:1px solid rgba(255,209,102,.28);
    font-size:13.5px;letter-spacing:.6px;color:#f0e2c2;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
  #sub.show{opacity:1}

  /* 关卡主题卡 */
  #stagecard{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
    opacity:0;transition:opacity .35s, transform .35s;z-index:3}
  #stagecard.show{opacity:1;transform:translate(-50%,-52%)}
  #stagecard .sc-year{font-size:78px;font-weight:900;letter-spacing:6px;line-height:1;
    background:linear-gradient(100deg,#fff,#8fe3ff 55%,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 10px 40px rgba(0,0,0,.6)}
  #stagecard .sc-title{margin-top:10px;font-size:20px;letter-spacing:4px;color:#ffd166;font-weight:700}
  #stagecard .sc-line{margin-top:12px;font-size:15px;letter-spacing:1.2px;color:#d6e4f7;max-width:760px;
    text-shadow:0 2px 18px rgba(0,0,0,.9)}
  #stagecard .sc-mech{margin-top:12px;display:inline-block;padding:4px 14px;border-radius:999px;
    background:rgba(6,12,22,.72);border:1px solid rgba(255,209,102,.3);font-size:12px;letter-spacing:1.5px;color:#f0d9a4}

  /* 提问背景 */
  #qhint{font-size:12px;letter-spacing:1px;color:rgba(255,209,102,.85);text-align:center;margin-bottom:5px}

  /* 覆盖层 */
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:6;padding:20px;
    background:radial-gradient(1100px 760px at 50% 45%,rgba(6,11,20,.52),rgba(2,4,9,.9));backdrop-filter:blur(8px)}
  .screen.hidden{display:none}
  .panel{width:min(780px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 30px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
  body.noanim .panel{animation:none!important}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .kicker{font-size:11px;letter-spacing:5px;color:var(--accent);margin-bottom:8px}
  h1{margin:0 0 6px;font-size:clamp(30px,4.6vw,52px);letter-spacing:5px;line-height:1.12;font-weight:800;
    background:linear-gradient(100deg,#fff 8%,#8fe3ff 45%,#ffd166 92%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:14px;letter-spacing:2px;margin-bottom:18px}
  .rules{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
  .rule{flex:1 1 170px;min-width:150px;padding:11px 13px;border-radius:11px;text-align:left;background:rgba(255,255,255,.03);
    border:1px solid rgba(120,180,255,.12);font-size:12.5px;color:#c3d3ea;line-height:1.55}
  .rule b{display:block;color:var(--accent);font-size:11px;letter-spacing:2px;margin-bottom:4px}
  kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}
  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;padding:13px 36px;border-radius:999px;font-size:15px;font-weight:700;
    letter-spacing:3px;color:#04121c;background:linear-gradient(100deg,#8fe3ff,#4fd1ff 45%,#ffd166);box-shadow:0 10px 28px rgba(79,209,255,.26);transition:.2s}
  .btn:hover{transform:translateY(-2px)}
  .hint{margin-top:12px;font-size:11.5px;color:#67788f;letter-spacing:1px}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .stat{flex:1 1 100px;padding:11px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(120,180,255,.12)}
  .stat b{display:block;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
  .stat span{font-size:10.5px;letter-spacing:2px;color:var(--dim)}
  #timeline{text-align:left;max-height:205px;overflow:auto;margin-bottom:16px}
  .tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed rgba(120,180,255,.12);font-size:12.5px;line-height:1.55}
  .tl:last-child{border:0}
  .tl b{flex:none;width:52px;color:var(--gold)}
  .tl span{color:#b6c8e0}

  /* 触屏按键 */
  #touch{position:absolute;inset:auto 0 0 0;height:120px;display:none;justify-content:space-between;padding:0 18px 14px;z-index:5}
  #touch button{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:1px solid rgba(140,200,255,.3);
    background:rgba(10,18,32,.6);color:#dbeaff;font-size:24px;font-family:inherit;backdrop-filter:blur(4px)}
  @media (hover:none) and (pointer:coarse){ #touch{display:flex} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="2560" height="1600"></canvas>

  <div id="hud">
    <div class="row">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="pill" id="eraTag">1956 · 启航</div>
        <div class="pill">死亡 <b id="deaths">0</b></div>
        <div class="pill">校徽 <b id="shards">0</b><span style="opacity:.5">/15</span></div>
      </div>
      <div class="pill"><span id="dots"></span></div>
    </div>
  </div>

  <div id="qbar"><div id="qhint"></div><div class="q" id="qtext"></div><div class="opts" id="qopts"></div></div>

  <div id="stagecard">
    <div class="sc-year" id="scYear"></div>

    <div class="sc-mech" id="scMech"></div>
  </div>
  <div id="toast"><div class="t1" id="toast1"></div><div class="t2" id="toast2"></div></div>

  <div class="screen" id="titleScreen">
    <div class="panel">
      <div class="kicker">I WANNA · 1956 — 2026</div>
      <h1>芯火七十年</h1>
      <div class="sub">杭州电子科技大学建校 70 周年 · 校史闯关</div>
      <div class="rules">
        <div class="rule"><b>跑</b><kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd> 移动，<kbd>↑</kbd><kbd>W</kbd><kbd>空格</kbd> 跳（二段跳）</div>
        <div class="rule"><b>死</b>尖刺 / 锯片 / 弹幕 / 坠落都是秒死，闪烁平台会定时消失</div>
        <div class="rule"><b>选</b>每关尽头 4 扇传送门 = 4 个选项，站到门前按 <kbd>↑</kbd> 进入</div>
      </div>
      <button class="btn" id="btnStart">开始受苦</button>
      <div class="hint">集齐 15 枚校徽碎片有额外评价 · 建议横屏 · R 键原地重来</div>
    </div>
  </div>

  <div class="screen hidden" id="endScreen">
    <div class="panel">
      <div class="kicker">PROUD OF HDU · 1956—2026</div>
      <h1 style="font-size:36px">七十华诞</h1>
      <div class="sub" id="endRank">芯火传人</div>
      <div class="stats">
        <div class="stat"><b id="endDeaths">0</b><span>死亡次数</span></div>
        <div class="stat"><b id="endTime">0:00</b><span>用时</span></div>
        <div class="stat"><b id="endQuiz">5/5</b><span>校史题</span></div>
        <div class="stat"><b id="endShards">0/15</b><span>校徽碎片</span></div>
      </div>
      <div id="timeline"></div>
      <button class="btn" id="btnAgain">再受一次苦</button>
      <div class="hint">笃学力行，守正求新 · 团结勤奋，求实创新</div>
    </div>
  </div>

  <div id="touch">
    <button id="tLeft">←</button>
    <div style="display:flex;gap:12px">
      <button id="tRight">→</button>
      <button id="tJump">↑</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var W = 1280, H = 800;
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var S = 2;
ctx.scale(S, S);

/* ---------------- 工具 ---------------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,k){ return a+(b-a)*k; }
function rand(a,b){ return a+Math.random()*(b-a); }
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function $(id){ return document.getElementById(id); }

/* ---------------- 音效 ---------------- */
var actx=null, soundOn=true;
function beep(freq,dur,type,vol,to){
  if(!soundOn) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(to) o.frequency.exponentialRampToValueAtTime(Math.max(40,to), actx.currentTime+dur);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol||0.06, actx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+0.03);
  }catch(e){}
}

/* ---------------- 输入 ---------------- */
var keys = {};
var jumpBuffer = 0, jumpHeld = false;
window.addEventListener('keydown', function(e){
  var k = e.code;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='ArrowLeft'||k==='ArrowRight'||k==='KeyA'||k==='KeyD') e.preventDefault();
  if(!keys[k]){
    if((k==='Space'||k==='ArrowUp'||k==='KeyW')){
      if(state==='title'){ startGame(); return; }
      if(state==='play'){
        if(nearPortal && overlappingPortal){ enterPortal(overlappingPortal); return; }
        jumpBuffer = 0.13;
      }
    }
    if(k==='KeyR' && state==='play'){ killPlayer(true); }
    if(k==='Enter' && (state==='title'||state==='end')) startGame();
  }
  keys[k]=true;
});
window.addEventListener('keyup', function(e){
  keys[e.code]=false;
  // 松键截断跳跃高度（I Wanna 手感）
  if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') && state==='play' && player.vy < -260){
    player.vy *= 0.45;
  }
});

// 触屏
function bindHold(el, code){
  el.addEventListener('pointerdown', function(e){ e.preventDefault(); keys[code]=true; if(code==='ArrowUp'){ if(state==='play'){ if(overlappingPortal){enterPortal(overlappingPortal);} else jumpBuffer=0.13; } } });
  el.addEventListener('pointerup', function(e){ e.preventDefault(); keys[code]=false; });
  el.addEventListener('pointercancel', function(){ keys[code]=false; });
  el.addEventListener('pointerleave', function(){ keys[code]=false; });
}
bindHold($('tLeft'), 'ArrowLeft');
bindHold($('tRight'), 'ArrowRight');
bindHold($('tJump'), 'ArrowUp');

/* ---------------- 物理常数 ---------------- */
var G=2600, MAXFALL=1500, SPEED=330, ACC=3400, FRIC=2800;
var JUMP=-830, JUMP2=-780, COYOTE=0.09;

/* ---------------- 关卡数据 ---------------- */
function g(x,y,w){ return {x:x,y:y,w:w,h:100,kind:'ground'}; }
function p(x,y,w){ return {x:x,y:y,w:w,h:22,kind:'plat'}; }
function mv(x,y,w,axis,range,speed){ return {x:x,y:y,w:w,h:22,kind:'plat',base:{x:x,y:y},move:{axis:axis,range:range,speed:speed,ph:Math.random()*6.28},px:x,py:y}; }
function sp(x,y,w,dir){ return {x:x,y:y,w:w,h:22,dir:dir||'up'}; }
// 闪烁平台：on 秒存在、off 秒消失
function bl(x,y,w,on,off,phase){ return {x:x,y:y,w:w,h:22,kind:'plat',blink:{on:on||1.05,off:off||0.55,phase:phase||0},active:true,left:0}; }
// 锯片：沿轴来回巡逻，碰到即死
function sw(x,y,r,axis,amp,speed,ph){ return {baseX:x,baseY:y,cx:x,cy:y,r:r,axis:axis,amp:amp,speed:speed,ph:ph||0}; }
// 校徽碎片
function sh(x,y){ return {x:x,y:y,got:false}; }
// 史料碑字幕：跑过时在底部显示一句史实
function note(x,text){ return {x:x,text:text,shown:false}; }
// 上升气流（1956 航空工业意象）
function wind(x,y,w,h,force){ return {x:x,y:y,w:w,h:h,force:force||1700}; }
// 激光栅（电路通电意象）：通电时碰到即死
function laz(x,y,w,h,on,off,phase){ return {x:x,y:y,w:w,h:h,on:on||1.3,off:off||1.0,phase:phase||0}; }
// 传送带：站在上面会被推着走（省部共建 / 产线意象）
function belt(pl, speed){ pl.belt = speed; return pl; }

var LETTERS = ['A','B','C','D'];

function doors(x0, topY, opts, a){
  return opts.map(function(t,i){
    return { x:x0 + i*146, y:topY-176, w:126, h:176, label:LETTERS[i], text:t, ok:(i===a) };
  });
}

var ROOMS = [
  {
    id:'r1', year:'1956', tag:'启航', name:'杭州航空工业财经学校',

    mech:'上升气流 · 窄台连跳',
    width:2260, spawn:{x:60,y:640},
    plats:[ g(0,700,280), p(400,620,80), p(560,540,70), p(720,620,70),
            p(880,520,70), p(1030,600,80), p(1180,540,70), p(1330,620,80),
            g(1500,700,760) ],
    spikes:[ sp(280,700,1220) ],
    saws:[],
    winds:[ wind(1040,300,110,300,3000) ],
    lasers:[],
    shards:[ sh(500,470), sh(1092,318), sh(1550,636) ],
    notes:[ note(180,'1956 · 前身杭州航空工业财经学校创建，隶属第二机械工业部'),
            note(1300,'校名此后七次更迭：航空工业学校 → 电机专科 → 机械工业 → 无线电工业……') ],
    save:{x:1560,y:700},
    doorsX:1640, doorStyle:'gate'
  },
  {
    id:'r2', year:'1980', tag:'建院', name:'杭州电子工业学院',

    opts:['1956 年','1978 年','1980 年','2004 年'], a:2,

    fact:'1980 年建立杭州电子工业学院，隶属电子工业部。',

    width:2300, spawn:{x:60,y:640},
    plats:[ g(0,700,260), p(380,640,70), p(520,560,60), p(660,640,60),
            p(800,560,60), p(940,640,60), p(1080,560,70), g(1240,700,1060) ],
    spikes:[ sp(260,700,980) ],
    saws:[ sw(700,505,26,'x',70,1.15), sw(1010,600,24,'y',62,1.35,1.4) ],
    winds:[],
    lasers:[ laz(920,470,14,230,1.3,1.0,0), laz(1130,470,14,230,1.3,1.0,1.15) ],
    shards:[ sh(430,590), sh(760,470), sh(1290,636) ],
    notes:[ note(150,'1980 · 建立杭州电子工业学院，隶属电子工业部，本科办学由此展开'),
            note(1050,'这一时期，学校的电子、计算机类专业群开始成形') ],
    save:{x:1300,y:700},
    doorsX:1380, doorStyle:'shutter'
  },
  {
    id:'r3', year:'2000', tag:'共建', name:'浙江省与信息产业部共建',
    q:'2000 年，学校成为哪两者共建的高校？',
    opts:['教育部与浙江省','浙江省与信息产业部','国防科工局与浙江省','电子工业部与浙江省'], a:1,

  r.doors = doors(r.doorsX, r.doorTop || 700, r.opts, r.a);

  r.img.onload = function(){ r.imgReady = true; };

var PUNISH = {
  id:'punish', width:1280, doors:[], spikes:[], q:'', opts:[],
  spawn:{x:610,y:620},
  plats:[ g(0,700,1280) ]
};

/* ---------------- 状态 ---------------- */
var state = 'title';        // title | play | trans | end | dead
var room = ROOMS[0];
var roomIndex = 0;
var camX = 0, camTarget = 0;
var deaths = 0, startTime = 0, elapsed = 0, correctCount = 0, lastCorrect = 0;
var shardCount = 0;
var opening = null;
var particles = [], bullets = [], rings = [];
var shake = 0, flash = 0, deadTimer = 0, transTimer = 0, transTarget = null;
var nearPortal = null, overlappingPortal = null;
var inPunish = false, punishTimer = 0, returnRoom = null, returnIndex = 0;
var t = 0, running = false;

var player = { x:70, y:600, w:24, h:32, vx:0, vy:0, onGround:false, jumpsLeft:2, coyote:0, face:1, squash:0, dead:false };

function playerBox(){ return {x:player.x, y:player.y, w:player.w, h:player.h}; }

/* ---------------- HUD ---------------- */
function updateHUD(){
  $('eraTag').textContent = (inPunish ? '弹幕惩罚房' : (room.year + ' · ' + room.tag));
  $('deaths').textContent = deaths;
  $('shards').textContent = shardCount;
  var html = '';
  for(var i=0;i<ROOMS.length;i++){
    html += '<i class="' + (i<roomIndex?'on':'') + (i===roomIndex&&!inPunish?' cur':'') + '"></i>';
  }
  $('dots').innerHTML = html;
}

var subTimer = 0;
function showSub(text){
  var el = $('sub');
  el.textContent = text;
  el.classList.add('show');
  subTimer = 4.2;
}

var cardTimer = 0;
function showStageCard(r){
  var el = $('stagecard');
  if(!r || !r.intro){ el.classList.remove('show'); return; }
  $('scYear').textContent = r.year;
  $('scTitle').textContent = r.tag + ' · ' + r.name;
  $('scLine').textContent = r.intro;
  $('scMech').textContent = '本关机关：' + (r.mech || '尖刺床');
  el.classList.add('show');
  cardTimer = 2.8;
}
function hideStageCard(){
  $('stagecard').classList.remove('show');
  cardTimer = 0;
}

function showQBar(on){
  var bar = $('qbar');
  if(!on){ bar.classList.remove('show'); return; }
  $('qtext').textContent = room.q;
  $('qhint').textContent = room.hint || '';
  var html = '';
  room.opts.forEach(function(o,i){ html += '<span><b>' + LETTERS[i] + '</b>' + o + '</span>'; });
  $('qopts').innerHTML = html;
  bar.classList.add('show');
}

var toastTimer = 0;
function toast(a,b,ms){
  $('toast1').textContent = a;
  $('toast2').textContent = b || '';
  $('toast').classList.add('show');
  toastTimer = (ms||1600)/1000;
}

/* ---------------- 生命周期 ---------------- */
function loadRoom(idx, keepStats){
  roomIndex = idx;
  room = ROOMS[idx];
  inPunish = false;
  opening = null;
  PUNISH.spikes.length = 0;
  bullets = []; rings = [];
  camX = 0; camTarget = 0;
  respawnPlayer();
  showQBar(false);
  updateHUD();
  showStageCard(room);
}

function respawnPlayer(){
  var s = (room.save && room.save.active) ? {x:room.save.x, y:room.save.y-60} : {x:room.spawn.x, y:room.spawn.y};
  player.x = s.x; player.y = s.y;
  player.vx = 0; player.vy = 0; player.onGround = false; player.jumpsLeft = 2;
  player.dead = false;
  player.squash = 0;
  deadTimer = 0;
}

function startGame(){
  if(!actx) beep(440,0.05,'square',0.03);
  ROOMS.forEach(function(r){
    r.save.active = false;
    (r.shards || []).forEach(function(s){ s.got = false; });
    (r.notes || []).forEach(function(n){ n.shown = false; });
    (r.keys || []).forEach(function(k){ k.got = false; });
  });
  shardCount = 0;
  deaths = 0; correctCount = 0; elapsed = 0; startTime = performance.now();
  state = 'play';
  $('titleScreen').classList.add('hidden');
  $('endScreen').classList.add('hidden');
  loadRoom(0);
  running = true;
}

function killPlayer(byPlayer){
  if(state !== 'play' || player.dead) return;
  player.dead = true;
  state = 'dead';
  deadTimer = 0;
  deaths++;
  shake = 0.4; flash = 0.5;
  burst(player.x + player.w/2, player.y + player.h/2, '#ff4d6d', 26);
  beep(220, 0.18, 'sawtooth', 0.07, 60);
  if(!byPlayer) updateHUD();
}

function respawnAfterDeath(){
  player.dead = false;
  state = 'play';
  if(inPunish){
    inPunish = false;
    bullets = []; rings = [];
    room = returnRoom; roomIndex = returnIndex;
    respawnPlayer();
    showQBar(false);
    toast('走错门了…', '被弹幕抬回存档点，再选一次', 1800);
    updateHUD();
  } else {
    respawnPlayer();
  }
}

function burst(x,y,color,n){
  for(var i=0;i<n;i++){
    var a = rand(0,6.283), sp = rand(60,420);
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-80,life:rand(.3,.8),max:.8,c:color,r:rand(1.5,3.4)});
  }
}

/* ---------------- 传送门 ---------------- */
function enterPortal(door){
  if(!door) return;
  if(room.keys && room.keys.some(function(k){ return !k.got; })){
    var miss = room.keys.filter(function(k){ return !k.got; }).map(function(k){ return k.ch; }).join('、');
    toast('校庆门未开启', '还差「' + miss + '」', 1500);
    beep(300,0.18,'square',0.05,180);
    return;
  }
  if(door.ok){
    lastCorrect = roomIndex;
    correctCount++;
    opening = { door:door, t:0 };
    toast('答对了', room.fact, 1500);
    beep(680,0.1,'sine',0.06,900);
    if(roomIndex >= ROOMS.length-1){
      state = 'trans'; transTimer = 0; transTarget = 'end';
    } else {
      state = 'trans'; transTimer = 0; transTarget = 'next';
      player.vx = 0;
    }
    for(var i=0;i<24;i++) burst(door.x+door.w/2, door.y+door.h/2, '#7ff0b0', 1);
  } else {
    beep(180,0.2,'square',0.07,80);
    state = 'trans'; transTimer = 0; transTarget = 'punish';
    returnRoom = room; returnIndex = roomIndex;
  }
}

function enterPunish(){
  inPunish = true;
  room = PUNISH;
  bullets = []; rings = [];
  punishTimer = 0;
  respawnPlayer();
  player.x = 610; player.y = 660;
  showQBar(false);
  hideStageCard();
  toast('错误答案！', '欢迎来到弹幕房……', 1600);
  updateHUD();
  state = 'play';
}

function endGame(){
  state = 'end';
  elapsed = (performance.now() - startTime)/1000;
  var mm = Math.floor(elapsed/60), ss = Math.floor(elapsed%60);
  $('endDeaths').textContent = deaths;
  $('endTime').textContent = mm + ':' + (ss<10?'0':'') + ss;
  $('endQuiz').textContent = correctCount + '/5';
  $('endShards').textContent = shardCount + '/15';
  var rank;
  if(shardCount >= 15 && deaths <= 15) rank = '芯火传人 · 全收集，手也稳';
  else if(shardCount >= 15) rank = '校史收藏家 · 一块都没落下';
  else if(deaths <= 15) rank = '芯火传人 · 手稳如你';
  else if(deaths <= 45) rank = '追光者 · 受苦但快乐';
  else rank = '启程者 · 弹幕的养分';
  $('endRank').textContent = rank;
  var tl = $('timeline');
  tl.innerHTML = '';
  ROOMS.forEach(function(r){
    var d = document.createElement('div');
    d.className = 'tl';
    d.innerHTML = '<b>' + r.year + '</b><span>' + r.fact + '</span>';
    tl.appendChild(d);
  });
  $('endScreen').classList.remove('hidden');
  beep(523,0.14,'sine',0.05); setTimeout(function(){beep(659,0.14,'sine',0.05);},120);
  setTimeout(function(){beep(784,0.3,'sine',0.05);},240);
}

/* ---------------- 物理 ---------------- */
var solidNow = [];
function solids(){
  return solidNow;
}

function updatePhysics(dt){
  var p = player;
  if(p.dead) return;

  // 闪烁平台：按相位决定这一刻是否存在
  solidNow = [];
  for(var bi=0; bi<room.plats.length; bi++){
    var bp = room.plats[bi];
    if(bp.blink){
      var per = bp.blink.on + bp.blink.off;
      var ph3 = ((t + bp.blink.phase) % per + per) % per;
      bp.active = ph3 < bp.blink.on;
      bp.left = bp.blink.on - ph3;
    } else {
      bp.active = true;
    }
    if(bp.active) solidNow.push(bp);
  }

  // 移动平台：先记录玩家是否站在上面，再移动平台并带着玩家走
  var standIdx = -1;
  for(var i0=0;i0<room.plats.length;i0++){
    var pl0 = room.plats[i0];
    if(!pl0.move || !pl0.active) continue;
    if(Math.abs((p.y+p.h) - pl0.y) < 5 && p.x + p.w > pl0.x + 2 && p.x < pl0.x + pl0.w - 2) standIdx = i0;
  }
  for(var i=0;i<room.plats.length;i++){
    var pl = room.plats[i];
    if(pl.move){
      var m = pl.move;
      var off = Math.sin(t * m.speed/60 + m.ph) * m.range;
      pl.px = pl.x; pl.py = pl.y;
      pl.x = m.axis==='x' ? pl.base.x + off : pl.base.x;
      pl.y = m.axis==='y' ? pl.base.y + off : pl.base.y;
    }
  }
  if(standIdx >= 0){
    var sm = room.plats[standIdx];
    p.x += sm.x - sm.px;
    p.y += sm.y - sm.py;
  }

  // 水平
  var dir = 0;
  if(keys['ArrowLeft']||keys['KeyA']) dir -= 1;
  if(keys['ArrowRight']||keys['KeyD']) dir += 1;
  if(dir !== 0){
    p.vx = clamp(p.vx + dir*ACC*dt, -SPEED, SPEED);
    p.face = dir;
  } else {
    var f = FRIC*dt;
    if(Math.abs(p.vx) <= f) p.vx = 0; else p.vx -= Math.sign(p.vx)*f;
  }

  p.x += p.vx*dt;
  for(var s=0;s<solids().length;s++){
    var o = solids()[s];
    if(aabb(p, o)){
      if(p.vx > 0){ p.x = o.x - p.w; }
      else if(p.vx < 0){ p.x = o.x + o.w; }
      p.vx = 0;
    }
  }
  p.x = clamp(p.x, 0, room.width - p.w);

  // 跳跃缓冲 / 土狼
  if(jumpBuffer > 0) jumpBuffer -= dt;
  if(p.onGround) p.coyote = COYOTE; else p.coyote -= dt;

  if(jumpBuffer > 0 && (p.onGround || p.coyote > 0 || p.jumpsLeft > 0)){
    var first = (p.onGround || p.coyote > 0);
    p.vy = first ? JUMP : JUMP2;
    p.onGround = false;
    p.coyote = 0;
    p.jumpsLeft = first ? 1 : 0;
    jumpBuffer = 0;
    p.squash = -1;
    beep(first?620:860, 0.07, 'square', 0.03, first?820:1100);
  }

  // 上升气流（航空工业意象）
  if(room.winds){
    for(var wi=0;wi<room.winds.length;wi++){
      var w0 = room.winds[wi];
      if(aabb(p, w0)){ p.vy = Math.max(p.vy - w0.force*dt, -430); }
    }
  }

  // 竖直
  p.vy = Math.min(MAXFALL, p.vy + G*dt);
  var prevBottom = p.y + p.h;
  p.y += p.vy*dt;

  var landed = false;
  for(var k=0;k<solids().length;k++){
    var q = solids()[k];
    if(aabb(p, q)){
      if(p.vy > 0 && prevBottom <= q.y + 12){
        p.y = q.y - p.h;
        p.vy = 0; p.onGround = true; p.jumpsLeft = 2; landed = true;
      } else if(p.vy < 0 && p.y < q.y){
        p.y = q.y + q.h; p.vy = 0;
      }
    }
  }
  if(!landed && p.vy > 0){
    // 检查脚下 2px 内的平台（避免抖动）
    var foot = {x:p.x, y:p.y + p.h, w:p.w, h:2};
    for(var n=0;n<solids().length;n++){
      var r = solids()[n];
      if(aabb(foot, r)){ p.onGround = true; p.jumpsLeft = 2; break; }
    }
  }

  if(p.onGround) p.squash = Math.min(1, p.squash + dt*6);

  // 死亡判定
  if(p.y > H + 140) { killPlayer(false); return; }

  var spBoxes = room.spikes;
  for(var si=0;si<spBoxes.length;si++){
    var sb = spBoxes[si];
    var hb = {x:sb.x+3, y:sb.y+5, w:sb.w-6, h:sb.h-5};
    if(sb.dir === 'down') hb = {x:sb.x+3, y:sb.y, w:sb.w-6, h:sb.h-5};
    if(aabb(p, hb)){ killPlayer(false); return; }
  }

  // 锯片
  if(room.saws && room.saws.length){ updateSaws(dt); if(state !== 'play') return; }

  // 激光栅（通电瞬间碰到即死）
  if(room.lasers){
    for(var li=0; li<room.lasers.length; li++){
      var lz = room.lasers[li];
      var lper = lz.on + lz.off;
      var lph = ((t + lz.phase) % lper + lper) % lper;
      lz.live = lph < lz.on;
      lz.warn = lz.live && (lz.on - lph) < 0.4;
      if(lz.live && aabb(p, lz)){ killPlayer(false); return; }
    }
  }

  // 传送带：站在带子上会被推着走
  if(p.onGround){
    for(var bi2=0; bi2<room.plats.length; bi2++){
      var bpl = room.plats[bi2];
      if(!bpl.belt || !bpl.active) continue;
      if(Math.abs((p.y+p.h) - bpl.y) < 4 && p.x + p.w > bpl.x && p.x < bpl.x + bpl.w){
        p.x += bpl.belt * dt;
        break;
      }
    }
  }

  // 校徽碎片
  if(room.shards){
    for(var shi=0; shi<room.shards.length; shi++){
      var sd = room.shards[shi];
      if(sd.got) continue;
      var dx2 = sd.x - (p.x + p.w/2), dy2 = sd.y - (p.y + p.h/2);
      if(dx2*dx2 + dy2*dy2 < 44*44){
        sd.got = true; shardCount++;
        beep(1040,0.09,'sine',0.05,1400);
        burst(sd.x, sd.y, '#ffd166', 12);
        updateHUD();
      }
    }
  }

  // 校训四字碑（第五关）
  if(room.keys){
    for(var ki=0; ki<room.keys.length; ki++){
      var kk2 = room.keys[ki];
      if(kk2.got) continue;
      var kdx = kk2.x - (p.x + p.w/2), kdy = kk2.y - (p.y + p.h/2);
      if(kdx*kdx + kdy*kdy < 50*50){
        kk2.got = true;
        beep(760,0.09,'sine',0.05,1040);
        burst(kk2.x, kk2.y, '#ffd166', 10);
        if(room.keys.every(function(z){ return z.got; })){
          toast('校训集齐', '笃学力行 · 校庆门已开启', 1900);
          beep(880,0.12,'sine',0.06,1320);
        }
      }
    }
  }

  // 史料碑字幕
  if(room.notes){
    for(var ni=0; ni<room.notes.length; ni++){
      var nt = room.notes[ni];
      if(!nt.shown && p.x + p.w > nt.x){ nt.shown = true; showSub(nt.text); }
    }
  }

  // 存档点
  if(room.save && !room.save.active){
    var sv = {x:room.save.x-30, y:room.save.y-90, w:60, h:90};
    if(aabb(p, sv)){
      room.save.active = true;
      beep(880,0.08,'sine',0.05,1320); setTimeout(function(){beep(1180,0.12,'sine',0.05,1560);},90);
      toast('已存档', '死亡后从这里重来', 1200);
      burst(room.save.x, room.save.y-40, '#7ff0b0', 14);
    }
  }

  // 传送门交互
  overlappingPortal = null;
  for(var di=0;di<room.doors.length;di++){
    if(aabb(p, room.doors[di])){ overlappingPortal = room.doors[di]; break; }
  }
  if(overlappingPortal) nearPortal = true;
  showQBar(player.x > room.zoneX);
}

function updateSaws(dt){
  var list = room.saws;
  for(var i=0;i<list.length;i++){
    var s = list[i];
    var off = Math.sin(t * s.speed + s.ph) * s.amp;
    s.cx = s.axis === 'x' ? s.baseX + off : s.baseX;
    s.cy = s.axis === 'y' ? s.baseY + off : s.baseY;
    var nx = clamp(s.cx, player.x, player.x + player.w);
    var ny = clamp(s.cy, player.y, player.y + player.h);
    var dx = s.cx - nx, dy = s.cy - ny;
    if(dx*dx + dy*dy < (s.r - 3) * (s.r - 3)){ killPlayer(false); return; }
  }
}

function updateBullets(dt){  if(!inPunish) return;
  punishTimer += dt;
  var p = player;

  // 发射器
  if(Math.random() < dt*22){
    var side = Math.random()<0.5 ? -20 : W+20;
    var y = rand(120, 640);
    var dx = p.x+p.w/2 - side, dy = p.y+p.h/2 - y;
    var len = Math.hypot(dx,dy) || 1;
    var sp2 = rand(240, 380);
    bullets.push({x:side, y:y, vx:dx/len*sp2, vy:dy/len*sp2, r:7, c:'#ff7b9c'});
  }
  if(Math.random() < dt*14){
    var ex = rand(80, W-80), ey = 100;
    var ddx = p.x - ex, ddy = p.y - ey;
    var l2 = Math.hypot(ddx,ddy)||1;
    bullets.push({x:ex, y:ey, vx:ddx/l2*290, vy:ddy/l2*290, r:6, c:'#ffd166'});
  }
  if(punishTimer > 0.8){
    if(!rings.length || punishTimer - rings[rings.length-1].at > 0.6){
      rings.push({at:punishTimer, x:W/2 + rand(-200,200), y:rand(240,540), r:10, life:0});
    }
  }

  for(var i=bullets.length-1;i>=0;i--){
    var b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.x < -60 || b.x > W+60 || b.y < -60 || b.y > H+60){ bullets.splice(i,1); continue; }
    if(aabb(p, {x:b.x-b.r, y:b.y-b.r, w:b.r*2, h:b.r*2})){ killPlayer(false); return; }
  }
  for(var r=rings.length-1;r>=0;r--){
    var rg = rings[r];
    rg.life += dt;
    if(rg.life > 0.05 && rg.life < 1.0){
      var n = 22;
      for(var k=0;k<n;k++){
        if(Math.random() < dt*6){
          var a = k/n*6.283 + rg.life;
          bullets.push({x:rg.x, y:rg.y, vx:Math.cos(a)*220, vy:Math.sin(a)*220, r:6.5, c:'#ff7b9c'});
        }
      }
    }
    if(rg.life > 1.6) rings.splice(r,1);
  }
}

/* ---------------- 主更新 ---------------- */
function update(dt){
  t += dt;
  if(toastTimer > 0){ toastTimer -= dt; if(toastTimer <= 0) $('toast').classList.remove('show'); }
  if(subTimer > 0){ subTimer -= dt; if(subTimer <= 0) $('sub').classList.remove('show'); }
  if(cardTimer > 0){ cardTimer -= dt; if(cardTimer <= 0) $('stagecard').classList.remove('show'); }
  if(shake > 0) shake = Math.max(0, shake - dt*1.6);
  if(flash > 0) flash = Math.max(0, flash - dt*2.2);

  if(state === 'dead'){
    deadTimer += dt;
    if(deadTimer > 0.55) respawnAfterDeath();
  } else if(state === 'trans'){
    transTimer += dt;
    if(opening) opening.t += dt;
    if(transTimer > 0.45){
      if(transTarget === 'next'){
        state = 'play';
        var nx = roomIndex + 1;
        loadRoom(nx);
      } else if(transTarget === 'punish'){
        enterPunish();
      } else if(transTarget === 'end'){
        endGame();
      }
    }
  } else if(state === 'play'){
    updatePhysics(dt);
    if(state === 'play') updateBullets(dt);
  }

  // 粒子
  for(var i=particles.length-1;i>=0;i--){
    var pa = particles[i];
    pa.life -= dt;
    if(pa.life <= 0){ particles.splice(i,1); continue; }
    pa.x += pa.vx*dt; pa.y += pa.vy*dt; pa.vy += 900*dt;
  }

  // 相机
  if(state !== 'title'){
    camTarget = clamp(player.x + player.w/2 - 560, 0, Math.max(0, room.width - W));
    camX = lerp(camX, camTarget, Math.min(1, dt*9));
  }
}

/* ---------------- 绘制 ---------------- */
function skyColors(){
  if(inPunish) return ['#1a0710','#3d0b1c'];
  var map = {1956:['#1d1710','#4a3722'],1980:['#0c1526','#1d3a5c'],2000:['#07161e','#0f3d4a'],2004:['#081426','#10305c'],2026:['#110b22','#2b1a4a']};
  return map[room.year] || ['#0c1526','#1d3a5c'];
}
function accent(){
  if(inPunish) return '#ff4d6d';
  var map = {1956:'#e8b56a',1980:'#7fb3ff',2000:'#5de1e6',2004:'#4fd1ff',2026:'#ffd166'};
  return map[room.year] || '#4fd1ff';
}

function drawBG(){
  if(room.imgReady && room.img && room.img.width){
    var iw = room.img.width, ih = room.img.height;
    var scale = Math.max(W/iw, H/ih) * 1.05;
    var dw = iw*scale, dh = ih*scale;
    var span = Math.max(1, dw - W);
    var ox = -((camX * 0.09) % span);
    var oy = -(dh - H) * 0.12;
    ctx.save();
    ctx.filter = 'blur(1.6px)';
    ctx.drawImage(room.img, ox, oy, dw, dh);
    ctx.restore();

    // 压暗 + 底部渐深，保证平台和角色清晰
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(4,8,14,.22)');
    g.addColorStop(.5, 'rgba(4,8,14,.42)');
    g.addColorStop(.82, 'rgba(3,6,12,.70)');
    g.addColorStop(1, 'rgba(3,6,12,.86)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 时代色调
    ctx.save();
    ctx.globalAlpha = .06;
    ctx.fillStyle = accent();
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    return;
  }
  drawBGProcedural();
}

function drawBGProcedural(){
  var c = skyColors(), acc = accent();
  var gr = ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0, c[0]); gr.addColorStop(.62, c[1]); gr.addColorStop(1,'#04070d');
  ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);

  var gl = ctx.createRadialGradient(W*0.7, 160, 20, W*0.7, 160, 620);
  gl.addColorStop(0,'rgba(255,255,255,.08)'); gl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(0,0,W,H);

  // 楼群（视差）
  var off1 = (camX*0.12) % 180;
  ctx.save(); ctx.globalAlpha = .55;
  for(var i=-1;i<9;i++){
    var bx = i*180 - off1, seed = i+7;
    var bh = 120 + ((seed*67)%180);
    var by = 700 - bh;
    ctx.fillStyle = 'rgba(4,8,14,.55)';
    ctx.fillRect(bx, by, 150, bh);
    ctx.fillStyle = 'rgba(120,190,255,.12)';
    for(var wy=by+16; wy<690; wy+=24){
      for(var wx=bx+12; wx<bx+138; wx+=22){
        if(((wx+wy+i)%9)<3) ctx.fillRect(wx,wy,8,10);
      }
    }
  }
  ctx.restore();

  var off2 = (camX*0.28) % 240;
  ctx.save(); ctx.globalAlpha = .75;
  for(var j=-1;j<7;j++){
    var bx2 = j*240 - off2, seed2 = j+13;
    var bh2 = 150 + ((seed2*83)%200);
    var by2 = 700 - bh2;
    ctx.fillStyle = 'rgba(3,6,12,.7)';
    ctx.fillRect(bx2, by2, 190, bh2);
    ctx.fillStyle = 'rgba(120,190,255,.10)';
    for(var wy2=by2+18; wy2<690; wy2+=26){
      for(var wx2=bx2+14; wx2<bx2+176; wx2+=24){
        if(((wx2+wy2+j)%11)<3) ctx.fillRect(wx2,wy2,9,11);
      }
    }
  }
  ctx.restore();

  // 电路线
  ctx.save(); ctx.globalAlpha = .5; ctx.strokeStyle = 'rgba(110,200,255,.09)'; ctx.lineWidth = 1;
  for(var k=0;k<4;k++){
    var y = 160 + k*100;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function drawMotif(){
  var acc = accent();
  ctx.save();
  ctx.globalAlpha = .13;
  if(room.year === '1956'){
    // 航空：一架纸飞机式的双翼机
    var fx = ((camX*0.08) % (W+400)) - 200;
    var fy = 150 + Math.sin(t*0.6)*10;
    ctx.translate(fx, fy);
    ctx.fillStyle = acc;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(70,14); ctx.lineTo(0,28); ctx.lineTo(14,14); ctx.closePath(); ctx.fill();
    ctx.fillRect(-26, 10, 26, 8);
    ctx.fillRect(6, 2, 40, 4);
  } else if(room.year === '1980'){
    // 电子：巨大的电路板与芯片
    ctx.strokeStyle = acc; ctx.lineWidth = 2;
    for(var i=0;i<6;i++){
      var yy = 120 + i*70;
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke();
    }
    for(var j=0;j<4;j++){
      var xx = 180 + j*300;
      ctx.strokeRect(xx, 200, 120, 90);
      ctx.strokeRect(xx+30, 225, 60, 40);
    }
  } else if(room.year === '2000'){
    // 共建：两座塔与连廊
    ctx.fillStyle = acc;
    ctx.fillRect(240, 260, 90, 440);
    ctx.fillRect(880, 220, 90, 480);
    ctx.fillRect(330, 380, 550, 22);
    for(var w=0; w<5; w++){
      ctx.globalAlpha = .06;
      ctx.fillRect(255, 300 + w*70, 60, 36);
      ctx.fillRect(895, 270 + w*74, 60, 38);
      ctx.globalAlpha = .13;
    }
  } else if(room.year === '2004'){
    // 更名：一块校名牌
    ctx.globalAlpha = .1;
    ctx.fillStyle = acc;
    ctx.fillRect(300, 250, 680, 130);
    ctx.globalAlpha = .22;
    ctx.fillStyle = '#06101c';
    ctx.font = '800 46px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('杭州电子科技大学', 640, 332);
  } else if(room.year === '2026'){
    // 七十周年
    ctx.globalAlpha = .12;
    ctx.fillStyle = acc;
    ctx.font = '900 300px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('70', 380, 430);
    ctx.strokeStyle = acc; ctx.lineWidth = 3;
    ctx.strokeRect(830, 180, 320, 200);
    ctx.strokeRect(870, 215, 240, 130);
  }
  ctx.restore();
}

function drawWinds(){
  if(!room.winds) return;
  for(var i=0;i<room.winds.length;i++){
    var w0 = room.winds[i];
    var x = w0.x - camX;
    if(x + w0.w < -80 || x > W+80) continue;
    ctx.save();
    var g = ctx.createLinearGradient(0, w0.y + w0.h, 0, w0.y);
    g.addColorStop(0, 'rgba(140,220,255,.16)');
    g.addColorStop(1, 'rgba(140,220,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x, w0.y, w0.w, w0.h);
    ctx.strokeStyle = 'rgba(160,230,255,.45)';
    ctx.lineWidth = 2;
    for(var k=0;k<5;k++){
      var yy = w0.y + w0.h - ((t*260 + k*70) % w0.h);
      var cx = x + w0.w/2 + Math.sin(t*2 + k)*10;
      ctx.beginPath();
      ctx.moveTo(cx - 9, yy + 10);
      ctx.lineTo(cx, yy);
      ctx.lineTo(cx + 9, yy + 10);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLasers(){
  if(!room.lasers) return;
  for(var i=0;i<room.lasers.length;i++){
    var lz = room.lasers[i];
    var x = lz.x - camX;
    if(x + lz.w < -60 || x > W+60) continue;
    ctx.save();
    if(lz.live){
      ctx.globalAlpha = .55 + .35*Math.abs(Math.sin(t*30));
      ctx.strokeStyle = '#ff4d6d';
      ctx.lineWidth = lz.w;
      ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(x + lz.w/2, lz.y);
      ctx.lineTo(x + lz.w/2, lz.y + lz.h);
      ctx.stroke();
    } else {
      ctx.globalAlpha = lz.warn ? .75 : .25;
      ctx.strokeStyle = '#ff8fa6';
      ctx.lineWidth = 2;
      ctx.setLineDash([6,8]);
      ctx.beginPath();
      ctx.moveTo(x + lz.w/2, lz.y);
      ctx.lineTo(x + lz.w/2, lz.y + lz.h);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // 发射器
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#243149';
    ctx.fillRect(x - 6, lz.y - 10, lz.w + 12, 12);
    ctx.fillRect(x - 6, lz.y + lz.h - 2, lz.w + 12, 12);
    ctx.fillStyle = lz.live ? '#ff4d6d' : '#5b6b86';
    ctx.fillRect(x - 2, lz.y - 6, lz.w + 4, 5);
    ctx.fillRect(x - 2, lz.y + lz.h - 1, lz.w + 4, 5);
    ctx.restore();
  }
}

function drawShards(){
  if(!room.shards) return;
  for(var i=0;i<room.shards.length;i++){
    var s = room.shards[i];
    if(s.got) continue;
    var x = s.x - camX, y = s.y + Math.sin(t*2.2 + i)*6;
    if(x < -60 || x > W+60) continue;
    ctx.save();
    ctx.translate(x, y);
    var g = ctx.createRadialGradient(0,0,2,0,0,34);
    g.addColorStop(0, 'rgba(255,225,150,.55)');
    g.addColorStop(1, 'rgba(255,225,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,34,0,6.283); ctx.fill();
    ctx.rotate(Math.sin(t*1.2 + i)*0.25);
    // 校徽碎片：六边形
    ctx.beginPath();
    for(var k=0;k<6;k++){
      var a = -Math.PI/2 + k*Math.PI/3;
      var px3 = Math.cos(a)*13, py3 = Math.sin(a)*13;
      if(k===0) ctx.moveTo(px3,py3); else ctx.lineTo(px3,py3);
    }
    ctx.closePath();
    ctx.fillStyle = '#ffd166';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();
  }
}

function drawPlats(){
  var acc = accent();
  for(var i=0;i<room.plats.length;i++){
    var pl = room.plats[i];
    var x = pl.x - camX;
    if(x + pl.w < -40 || x > W+40) continue;

    // 闪烁平台消失时只留虚影
    if(pl.blink && !pl.active){
      ctx.save();
      ctx.globalAlpha = .16;
      ctx.strokeStyle = acc;
      ctx.setLineDash([5,7]);
      ctx.strokeRect(x+.5, pl.y+.5, pl.w-1, pl.h-1);
      ctx.setLineDash([]);
      ctx.restore();
      continue;
    }
    if(pl.blink && pl.left < .32){
      ctx.globalAlpha = .5 + .5 * Math.abs(Math.sin(t*22));
    }

    // 主体
    var g2 = ctx.createLinearGradient(0, pl.y, 0, pl.y+pl.h);
    g2.addColorStop(0, 'rgba(44,66,100,.98)');
    g2.addColorStop(.35, 'rgba(24,38,60,.98)');
    g2.addColorStop(1, 'rgba(10,16,28,.98)');
    ctx.fillStyle = g2;
    ctx.fillRect(x, pl.y, pl.w, pl.h);

    // 顶部高光 + 发光
    ctx.save();
    ctx.shadowColor = acc; ctx.shadowBlur = 14;
    ctx.fillStyle = acc;
    ctx.globalAlpha = .95;
    ctx.fillRect(x, pl.y - 2, pl.w, 3);
    ctx.restore();

    // 底部边缘
    ctx.fillStyle = 'rgba(140,190,240,.10)';
    ctx.fillRect(x, pl.y + pl.h - 1, pl.w, 1);

    // 引脚纹理
    ctx.fillStyle = 'rgba(120,180,255,.12)';
    for(var px2=x+10; px2<x+pl.w-8; px2+=22){
      ctx.fillRect(px2, pl.y+8, 8, 8);
    }

    if(pl.move){
      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.setLineDash([6,6]);
      ctx.strokeRect(x+.5, pl.y+.5, pl.w-1, pl.h-1);
      ctx.setLineDash([]);
    }

    // 传送带箭头
    if(pl.belt){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,209,102,.6)';
      ctx.lineWidth = 2;
      var shift = (t * pl.belt * 1.1) % 24;
      var dir = pl.belt > 0 ? 1 : -1;
      for(var bx = x + 6; bx < x + pl.w - 6; bx += 24){
        var cx2 = bx + shift;
        ctx.beginPath();
        if(dir > 0){
          ctx.moveTo(cx2, pl.y + 6);
          ctx.lineTo(cx2 + 9, pl.y + 11);
          ctx.lineTo(cx2, pl.y + 16);
        } else {
          ctx.moveTo(cx2 + 9, pl.y + 6);
          ctx.lineTo(cx2, pl.y + 11);
          ctx.lineTo(cx2 + 9, pl.y + 16);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function drawSaws(){
  if(!room.saws) return;
  for(var i=0;i<room.saws.length;i++){
    var s = room.saws[i];
    var x = (s.cx || s.baseX) - camX, y = (s.cy || s.baseY);
    if(x < -90 || x > W+90) continue;
    ctx.save();
    ctx.translate(x, y);

    // 危险光晕
    var hg = ctx.createRadialGradient(0,0,s.r*0.4,0,0,s.r+22);
    hg.addColorStop(0,'rgba(255,77,109,.22)');
    hg.addColorStop(1,'rgba(255,77,109,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0,0,s.r+22,0,6.283); ctx.fill();

    ctx.rotate(t*5 + i);
    var n = 10;
    ctx.fillStyle = '#cfdaea';
    for(var k=0;k<n;k++){
      ctx.beginPath();
      ctx.moveTo(s.r-2, -5);
      ctx.lineTo(s.r+7, 0);
      ctx.lineTo(s.r-2, 5);
      ctx.closePath(); ctx.fill();
      ctx.rotate(6.283/n);
    }
    var g2 = ctx.createRadialGradient(-s.r*0.3,-s.r*0.3,2,0,0,s.r);
    g2.addColorStop(0,'#ffffff'); g2.addColorStop(.55,'#a8b9ce'); g2.addColorStop(1,'#46566c');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0,0,s.r,0,6.283); ctx.fill();
    ctx.fillStyle = '#131c2b';
    ctx.beginPath(); ctx.arc(0,0,s.r*0.34,0,6.283); ctx.fill();
    ctx.restore();
  }
}

function drawSpikes(){
  for(var i=0;i<room.spikes.length;i++){
    var s = room.spikes[i];
    var x = s.x - camX;
    if(x + s.w < -60 || x > W+60) continue;
    var n = Math.max(2, Math.round(s.w / 18));
    var ww = s.w / n;
    ctx.save();
    for(var k=0;k<n;k++){
      var bx = x + k*ww;
      var tri;
      if(s.dir === 'down'){
        tri = [[bx, s.y], [bx+ww, s.y], [bx+ww/2, s.y + s.h]];
      } else {
        tri = [[bx, s.y + s.h], [bx+ww, s.y + s.h], [bx+ww/2, s.y]];
      }
      var gg = ctx.createLinearGradient(0, s.y, 0, s.y+s.h);
      gg.addColorStop(0, '#ff8fa6');
      gg.addColorStop(1, '#c2183c');
      ctx.fillStyle = gg;
      ctx.beginPath();
      ctx.moveTo(tri[0][0], tri[0][1]);
      ctx.lineTo(tri[1][0], tri[1][1]);
      ctx.lineTo(tri[2][0], tri[2][1]);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawSave(){
  if(!room.save || inPunish) return;
  var x = room.save.x - camX;
  if(x < -80 || x > W+80) return;
  var y = room.save.y;
  var on = room.save.active;
  var col = on ? '#7ff0b0' : '#8fa8c8';
  ctx.save();
  ctx.globalAlpha = on ? .95 : .6;
  // 光柱
  var lg = ctx.createLinearGradient(0, y-150, 0, y);
  lg.addColorStop(0, 'rgba(127,240,176,0)');
  lg.addColorStop(1, on ? 'rgba(127,240,176,.22)' : 'rgba(150,180,210,.12)');
  ctx.fillStyle = lg;
  ctx.fillRect(x-26, y-150, 52, 150);

  // 旗杆
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y-92); ctx.stroke();
  // 旗
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y-92);
  ctx.quadraticCurveTo(x+30, y-84, x+52, y-74);
  ctx.quadraticCurveTo(x+30, y-64, x, y-58);
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.fillStyle = col;
  ctx.font = '700 12px "PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(on ? '已存档' : '存档点', x+4, y+22);
  ctx.restore();
}

function wrapLines(text, maxW, font){
  ctx.font = font;
  var lines = [], cur = '';
  for(var i=0;i<text.length;i++){
    var ch = text[i];
    if(ctx.measureText(cur+ch).width > maxW && cur.length){ lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if(cur) lines.push(cur);
  return lines;
}

function drawDoors(){
  for(var i=0;i<room.doors.length;i++){
    var d = room.doors[i];
    var x = d.x - camX;
    if(x + d.w < -170 || x > W+170) continue;
    var k = (opening && opening.door === d) ? Math.min(1, opening.t/0.45) : 0;
    drawDoorOne(d, x, k);
  }
  if(room.keys) drawKeysHUD();
}

var DOOR_STYLE = {
  gate:    {panel:'#6b4626', trim:'#c9a35a', dark:'#3d2716'},
  shutter: {panel:'#46566e', trim:'#93a8c2', dark:'#26303f'},
  podium:  {panel:'#9b2434', trim:'#e3b45c', dark:'#5c1119'},
  plaque:  {panel:'#5d3e1f', trim:'#d8b46a', dark:'#38240f'},
  arch:    {panel:'#b82536', trim:'#ffd166', dark:'#6d1020'}
};

function panelRects(d, x, k, style){
  var pad = 10, top = d.y + 30, bottom = d.y + d.h - 6;
  var w = d.w - pad*2, h = bottom - top;
  if(style === 'shutter' || style === 'arch'){
    var hh = h * (1 - k);
    return [{x:x+pad, y:bottom-hh, w:w, h:hh}];
  }
  if(style === 'plaque'){
    var ww = w * Math.max(0.03, Math.abs(Math.cos(k*Math.PI/2)));
    return [{x:x+d.w/2-ww/2, y:top, w:ww, h:h}];
  }
  var half = (w/2) * (1 - k);
  return [{x:x+pad, y:top, w:half, h:h}, {x:x+d.w-pad-half, y:top, w:half, h:h}];
}

function drawDoorOne(d, x, k){
  var hot = (overlappingPortal === d);
  var style = room.doorStyle || 'gate';
  var c = DOOR_STYLE[style];
  var acc = accent();
  var y = d.y, w = d.w, h = d.h;

  ctx.save();

  // 地面光斑
  var fg = ctx.createRadialGradient(x + w/2, y + h, 4, x + w/2, y + h, 90);
  fg.addColorStop(0, hot ? 'rgba(255,209,102,.28)' : 'rgba(120,190,255,.14)');
  fg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = fg;
  ctx.fillRect(x - 60, y + h - 40, w + 120, 90);

  // 门洞里透出的光
  var gd = ctx.createLinearGradient(0, y, 0, y + h);
  gd.addColorStop(0, hot ? 'rgba(255,209,102,.30)' : 'rgba(150,205,255,.10)');
  gd.addColorStop(1, 'rgba(6,12,22,.6)');
  ctx.fillStyle = gd;
  ctx.fillRect(x + 6, y + 26, w - 12, h - 26);

  // 按样式画门框
  ctx.strokeStyle = c.trim;
  ctx.lineWidth = 3;
  if(style === 'gate'){
    // 老校门：两根立柱 + 顶部匾额
    ctx.fillStyle = c.dark;
    ctx.fillRect(x - 4, y + 10, 16, h - 10);
    ctx.fillRect(x + w - 12, y + 10, 16, h - 10);
    ctx.fillStyle = c.panel;
    ctx.fillRect(x + 2, y - 8, w - 4, 34);
    ctx.strokeRect(x + 2, y - 8, w - 4, 34);
    ctx.fillStyle = c.trim;
    ctx.font = '700 12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('1 9 5 6', x + w/2, y + 14);
  } else if(style === 'shutter'){
    // 厂房卷帘门：顶部卷轴 + 两侧导轨
    ctx.fillStyle = c.dark;
    ctx.fillRect(x - 6, y + 6, w + 12, 22);
    ctx.strokeRect(x - 6, y + 6, w + 12, 22);
    ctx.fillRect(x - 4, y + 26, 10, h - 26);
    ctx.fillRect(x + w - 6, y + 26, 10, h - 26);
  } else if(style === 'podium'){
    // 共建签约台：红绸 + 两端立牌
    ctx.fillStyle = c.trim;
    ctx.fillRect(x - 6, y + 4, w + 12, 8);
    ctx.fillStyle = c.dark;
    ctx.fillRect(x - 2, y + 12, w + 4, 16);
    ctx.beginPath();
    ctx.moveTo(x - 2, y + 28);
    ctx.lineTo(x + w + 2, y + 28);
    ctx.lineTo(x + w - 4, y + h);
    ctx.lineTo(x + 6, y + h);
    ctx.closePath();
    ctx.globalAlpha = .5;
    ctx.fillStyle = c.panel;
    ctx.fill();
    ctx.globalAlpha = 1;
  } else if(style === 'plaque'){
    // 换牌：两根吊绳 + 横梁
    ctx.strokeStyle = 'rgba(220,200,160,.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + w/2 - 30, y - 40); ctx.lineTo(x + w/2 - 30, y + 4);
    ctx.moveTo(x + w/2 + 30, y - 40); ctx.lineTo(x + w/2 + 30, y + 4);
    ctx.stroke();
    ctx.fillStyle = c.dark;
    ctx.fillRect(x - 14, y - 48, w + 28, 12);
    ctx.strokeStyle = c.trim;
    ctx.strokeRect(x - 14, y - 48, w + 28, 12);
  } else {
    // 校庆拱门：拱形 + 飘带
    ctx.strokeStyle = c.trim;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(x - 2, y + h);
    ctx.lineTo(x - 2, y + 40);
    ctx.quadraticCurveTo(x + w/2, y - 30, x + w + 2, y + 40);
    ctx.lineTo(x + w + 2, y + h);
    ctx.stroke();
    for(var rb = 0; rb < 5; rb++){
      ctx.fillStyle = rb % 2 ? '#ffd166' : c.panel;
      ctx.globalAlpha = .8;
      ctx.fillRect(x + 6 + rb*(w-12)/5, y - 16 + Math.sin(t*2 + rb)*3, (w-12)/5 - 4, 12);
      ctx.globalAlpha = 1;
    }
  }

  // 门板（会开）
  var rects = panelRects(d, x, k, style);
  for(var ri=0; ri<rects.length; ri++){
    var r = rects[ri];
    if(r.w < 0.5 || r.h < 0.5) continue;
    ctx.fillStyle = c.panel;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = c.dark;
    ctx.lineWidth = 2;
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    // 木纹 / 卷帘槽 / 门钉
    if(style === 'shutter'){
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.lineWidth = 1;
      for(var sy = r.y + 6; sy < r.y + r.h - 4; sy += 9){
        ctx.beginPath(); ctx.moveTo(r.x + 2, sy); ctx.lineTo(r.x + r.w - 2, sy); ctx.stroke();
      }
    } else if(style === 'gate'){
      ctx.fillStyle = 'rgba(255,215,150,.35)';
      for(var sx = r.x + 12; sx < r.x + r.w - 6; sx += 22){
        for(var yy = r.y + 16; yy < r.y + r.h - 10; yy += 26){
          ctx.beginPath(); ctx.arc(sx, yy, 2, 0, 6.283); ctx.fill();
        }
      }
    } else if(style === 'podium'){
      ctx.fillStyle = 'rgba(255,215,150,.25)';
      ctx.fillRect(r.x + 4, r.y + 8, r.w - 8, 2);
    } else if(style === 'plaque'){
      ctx.strokeStyle = c.trim;
      ctx.lineWidth = 3;
      ctx.strokeRect(r.x + 5, r.y + 5, r.w - 10, r.h - 10);
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.18)';
      ctx.lineWidth = 1;
      for(var vx = r.x + 14; vx < r.x + r.w; vx += 18){
        ctx.beginPath(); ctx.moveTo(vx, r.y + 2); ctx.lineTo(vx, r.y + r.h - 2); ctx.stroke();
      }
    }
  }

  // 字母与选项文字（开门时淡出）
  ctx.globalAlpha = Math.max(0, 1 - k*1.2);
  ctx.textAlign = 'center';
  ctx.fillStyle = hot ? '#ffd166' : '#f2f7ff';
  ctx.font = '800 34px "PingFang SC",sans-serif';
  ctx.shadowColor = hot ? '#ffd166' : acc;
  ctx.shadowBlur = hot ? 22 : 10;
  ctx.fillText(d.label, x + w/2, y + 62);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(225,238,252,.92)';
  var lines = wrapLines(d.text, w - 22, '500 13px "PingFang SC",sans-serif');
  ctx.font = '500 13px "PingFang SC",sans-serif';
  for(var l=0;l<lines.length && l<3;l++){
    ctx.fillText(lines[l], x + w/2, y + 92 + l*19);
  }
  ctx.globalAlpha = 1;

  // 交互提示
  if(hot){
    ctx.fillStyle = '#ffd166';
    ctx.font = '700 13px "PingFang SC",sans-serif';
    var ready = !room.keys || room.keys.every(function(kk){ return kk.got; });
    ctx.fillText(ready ? '↑ 进入' : '↑ 还差校训', x + w/2, y - 58);
  }
  ctx.restore();
}

function drawKeys(){
  if(!room.keys) return;
  for(var i=0;i<room.keys.length;i++){
    var kk = room.keys[i];
    if(kk.got) continue;
    var x = kk.x - camX, y = kk.y + Math.sin(t*2 + i)*5;
    if(x < -60 || x > W+60) continue;
    ctx.save();
    ctx.translate(x, y);
    var g = ctx.createRadialGradient(0,0,3,0,0,40);
    g.addColorStop(0,'rgba(255,225,150,.5)');
    g.addColorStop(1,'rgba(255,225,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,40,0,6.283); ctx.fill();
    // 石碑
    ctx.fillStyle = '#3c4250';
    ctx.beginPath();
    ctx.roundRect(-15, -20, 30, 40, 6);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,235,190,.55)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.font = '800 22px "PingFang SC","Microsoft YaHei",serif';
    ctx.textAlign = 'center';
    ctx.fillText(kk.ch, 0, 8);
    ctx.restore();
  }
}

function drawKeysHUD(){
  var keys = room.keys;
  var all = keys.every(function(kk){ return kk.got; });
  var baseX = (room.doorsX - camX) + 2*146 + 63;
  var y = 700 - 176 - 56;
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 13px "PingFang SC",sans-serif';
  ctx.fillStyle = all ? 'rgba(127,240,176,.95)' : 'rgba(255,209,102,.8)';
  ctx.fillText(all ? '校训集齐 · 校庆门已开启' : '集齐校训才能开启校庆门', baseX, y - 8);
  for(var i=0;i<keys.length;i++){
    var kx = baseX - 3*21 + i*42;
    ctx.beginPath();
    ctx.roundRect(kx - 15, y + 6, 30, 30, 5);
    ctx.fillStyle = keys[i].got ? 'rgba(255,209,102,.9)' : 'rgba(255,255,255,.06)';
    ctx.fill();
    ctx.strokeStyle = keys[i].got ? '#ffe6a8' : 'rgba(255,255,255,.18)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.fillStyle = keys[i].got ? '#2a1c05' : 'rgba(220,235,250,.3)';
    ctx.font = '800 17px "PingFang SC",serif';
    ctx.fillText(keys[i].ch, kx, y + 28);
  }
  ctx.restore();
}

function drawPlayer(){
  if(player.dead) return;
  var x = player.x + player.w/2 - camX, y = player.y + player.h;
  var sq = player.squash;

  // 影子
  ctx.save();
  ctx.globalAlpha = .35;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(x, y+3, 16, 5, 0, 0, 6.283); ctx.fill();
  ctx.restore();

  var w = 24 * (1 + sq*0.14), h = 32 * (1 - sq*0.18);
  ctx.save();
  ctx.translate(x, y - h/2);

  // 身体
  var bg = ctx.createLinearGradient(0,-h/2,0,h/2);
  bg.addColorStop(0,'#ffffff');
  bg.addColorStop(.5, accent());
  bg.addColorStop(1,'#0b2a44');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(-w/2, -h/2, w, h, 7);
  ctx.fill();

  // 引脚
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  for(var i=0;i<2;i++){
    var yy = -6 + i*12;
    ctx.beginPath(); ctx.moveTo(-w/2, yy); ctx.lineTo(-w/2-4, yy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2, yy); ctx.lineTo(w/2+4, yy); ctx.stroke();
  }

  // 眼睛
  ctx.fillStyle = '#06111d';
  ctx.beginPath(); ctx.arc(-5, -4, 2.6, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -4, 2.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(-4.2, -4.8, .9, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(5.8, -4.8, .9, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b = bullets[i];
    var x = b.x - camX;
    ctx.save();
    ctx.shadowColor = b.c; ctx.shadowBlur = 16;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(x, b.y, b.r, 0, 6.283); ctx.fill();
    ctx.globalAlpha = .35;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x, b.y, b.r*0.45, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  for(var r=0;r<rings.length;r++){
    var rg = rings[r];
    if(rg.life<=0) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, .5 - rg.life*.3);
    ctx.strokeStyle = '#ff7b9c'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(rg.x-camX, rg.y, 30 + rg.life*260, 0, 6.283); ctx.stroke();
    ctx.restore();
  }
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p = particles[i];
    ctx.globalAlpha = clamp(p.life/p.max,0,1);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawRoomTag(){
  if(state==='title') return;
  ctx.save();
  ctx.textAlign = 'left';
  ctx.globalAlpha = .45;
  ctx.fillStyle = '#dbeaff';
  ctx.font = '700 13px "PingFang SC",sans-serif';
  var label = inPunish ? '弹幕惩罚房' : (room.year + ' · ' + room.tag);
  ctx.fillText(label, 22, H-16);
  ctx.restore();
}

function render(){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.clearRect(0,0,W,H);

  var shx = shake>0 ? rand(-8,8)*shake : 0;
  var shy = shake>0 ? rand(-6,6)*shake : 0;

  ctx.save();
  ctx.translate(shx, shy);
  drawBG();
  if(!room.imgReady) drawMotif();
  drawPlats();
  drawWinds();
  drawSpikes();
  drawSaws();
  drawLasers();
  drawSave();
  drawKeys();
  drawDoors();
  drawShards();
  drawBullets();
  drawPlayer();
  drawParticles();
  ctx.restore();

  // 边框暗角
  var vg = ctx.createRadialGradient(W/2,H/2,H*.36,W/2,H/2,H*.94);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if(flash > 0){
    ctx.fillStyle = 'rgba(255,60,90,' + (flash*0.35).toFixed(3) + ')';
    ctx.fillRect(0,0,W,H);
  }
  if(state === 'trans'){
    ctx.fillStyle = 'rgba(2,4,9,' + Math.min(1, transTimer/0.4).toFixed(2) + ')';
    ctx.fillRect(0,0,W,H);
  }

  drawRoomTag();
}

/* ---------------- 主循环 ---------------- */
var last = 0, acc = 0, FIXED = 1/120;
function loop(now){
  if(!last) last = now;
  var dt = Math.min(0.05, (now-last)/1000);
  last = now;
  acc += dt;
  while(acc >= FIXED){ update(FIXED); acc -= FIXED; }
  render();
  requestAnimationFrame(loop);
}

/* ---------------- 调试 ---------------- */
var qs = new URLSearchParams(location.search);
(function boot(){
  var qroom = qs.get('room');
  if(qroom !== null){
    var idx = qroom === 'p' ? -1 : clamp(parseInt(qroom,10)||0, 0, ROOMS.length-1);
    startGame();
    if(idx >= 0) loadRoom(idx);
    else enterPunish();
  } else if(qs.get('play') === '1'){
    startGame();
  }
  var qx = qs.get('x'), qy = qs.get('y');
  if(qx !== null && qx !== undefined && qx !== ''){
    player.x = parseInt(qx,10) || 0;
    camX = clamp(player.x - 560, 0, Math.max(0, room.width - W));
    camTarget = camX;
  }
  if(qy !== null && qy !== undefined && qy !== ''){
    player.y = parseInt(qy,10) || 0;
    player.vy = 0;
  }
  if(qs.get('shot') === 'play'){ document.body.classList.add('noanim'); }
  if(qs.get('end') === '1'){
    startGame(); deaths = 7; correctCount = 5; startTime = performance.now() - 95000;
    endGame();
  }

  var qnear = qs.get('near');
  if(qnear !== null && qnear !== undefined && qnear !== ''){
    var ni = clamp((parseInt(qnear,10)||1) - 1, 0, ROOMS.length-1);
    startGame(); loadRoom(ni);
    player.x = ROOMS[ni].save.x + 20;
    player.y = ROOMS[ni].save.y - 40;
    camX = clamp(player.x - 620, 0, Math.max(0, room.width - W));
    camTarget = camX;
    if(ROOMS[ni].keys) ROOMS[ni].keys.forEach(function(k){ k.got = true; });
  }

  // 开门动画演示
  if(qs.get('opendemo') === '1'){
    startGame(); loadRoom(0);
    player.x = room.doorsX + 40;
    player.y = 660;
    camX = clamp(player.x - 620, 0, Math.max(0, room.width - W));
    camTarget = camX;
    opening = { door: room.doors[room.a], t: 0.24 };
  }

  // 几何自检：存档点 / 尖刺 / 传送门 是否重叠
  if(qs.get('check') === '1'){
    var rep = [];
    ROOMS.forEach(function(r){
      var probs = [];
      var sz = {x:r.save.x-30, y:r.save.y-90, w:60, h:90};
      r.spikes.forEach(function(s){
        if(aabb(sz, s)) probs.push('存档点压在尖刺上@' + s.x);
        r.doors.forEach(function(d){ if(aabb(s, d)) probs.push('尖刺压住传送门' + d.label); });
      });
      r.doors.forEach(function(d){ if(aabb(sz, d)) probs.push('存档点压住传送门' + d.label); });
      (r.saws || []).forEach(function(s){
        var dx = s.axis === 'x' ? s.amp : 0, dy = s.axis === 'y' ? s.amp : 0;
        var box = {x:s.baseX-dx-s.r, y:s.baseY-dy-s.r, w:(dx*2+s.r*2), h:(dy*2+s.r*2)};
        if(aabb(box, sz)) probs.push('锯片路径盖住存档点');
        r.doors.forEach(function(d){ if(aabb(box, d)) probs.push('锯片路径盖住门' + d.label); });
      });
      if(r.spikes.some(function(s){ return aabb({x:r.spawn.x, y:r.spawn.y-10, w:24, h:44}, s); })) probs.push('出生点压在尖刺上');
      rep.push(r.year + ':' + (probs.length ? probs.join('/') : 'ok'));
    });
    document.title = 'CHECK ' + rep.join(' | ');
  }
  if(qs.get('probe') === '1'){
    function groundAt(x, yTop){
      for(var i2=0;i2<room.plats.length;i2++){
        var q2=room.plats[i2];
        if(x > q2.x+4 && x < q2.x+q2.w-4 && q2.y >= yTop-4 && q2.y <= yTop+260) return true;
      }
      return false;
    }
    var out=[];
    startGame();
    for(var ri=0; ri<ROOMS.length; ri++){
      loadRoom(ri);
      // 只测几何连通性：暂时摘掉伤害源与闪烁，AI 太笨，测不出关卡难度
      var savedSpikes = room.spikes, savedSaws = room.saws;
      var blinkBack = [];
      room.spikes = []; room.saws = [];
      room.plats.forEach(function(pl){
        if(pl.blink){ blinkBack.push([pl, pl.blink]); pl.blink = null; pl.active = true; }
      });
      var best=0, reached=false;
      for(var f=0; f<60*40; f++){
        keys['ArrowRight']=true; keys['ArrowLeft']=false;
        var feet=player.y+player.h, fx=player.x+player.w;
        var gap = !groundAt(fx+62, feet);
        var riseAhead=false;
        for(var pi=0; pi<room.plats.length; pi++){
          var q3=room.plats[pi];
          if(q3.x > fx-8 && q3.x < fx+110 && q3.y < feet-14 && q3.y > feet-220) riseAhead=true;
        }
        if(player.onGround && (gap || riseAhead)) jumpBuffer=0.14;
        if(!player.onGround && player.vy > 0 && player.jumpsLeft>0 && !groundAt(player.x+player.w/2, feet)) jumpBuffer=0.14;
        update(1/60);
        if(player.x > best) best = player.x;
        if(player.x > room.doorsX-70){ reached=true; break; }
      }
      keys['ArrowRight']=false;
      room.spikes = savedSpikes; room.saws = savedSaws;
      blinkBack.forEach(function(pair){ pair[0].blink = pair[1]; });
      out.push(ROOMS[ri].year+':'+Math.round(best)+(reached?'-OK':'-FAIL'));
    }
    document.title='PROBE(geometry) ' + out.join(' | ') + ' | deaths=' + deaths;
  }

  // 状态机自检：正确门走完全程；错误门进弹幕房并死亡回传
  if(qs.get('flow') === '1'){
    var log = [];
    startGame();
    for(var i=0;i<ROOMS.length;i++){
      roomIndex = i; room = ROOMS[i];
      if(room.keys) room.keys.forEach(function(k){ k.got = true; });
      enterPortal(room.doors[room.a]);
      var guard = 0;
      while(state !== 'play' && state !== 'end' && guard++ < 200) update(1/60);
      log.push('correct->' + state + '@' + roomIndex);
      if(state === 'end') break;
    }
    // 错误门
    startGame();
    roomIndex = 0; room = ROOMS[0];
    var wrong = room.doors.filter(function(d){ return !d.ok; })[0];
    enterPortal(wrong);
    guard = 0;
    while(state !== 'play' && guard++ < 200) update(1/60);
    log.push('wrong->' + (inPunish ? 'punish' : '??'));
    for(var f=0; f<240; f++) update(1/60);
    var punished = (state === 'dead' || state === 'play');
    log.push('after_bullets:' + state + '/' + (inPunish?'inPunish':'back'));
    killPlayer(false);
    guard = 0;
    while(state !== 'play' && guard++ < 200) update(1/60);
    log.push('respawn:' + state + '@' + roomIndex + '/' + (room.save && room.save.active ? 'saved' : 'spawn'));
    document.title = 'FLOW ' + log.join(' | ');
  }
})();

$('btnStart').addEventListener('click', startGame);
$('btnAgain').addEventListener('click', startGame);

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
